<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preferred Vendor Connections | DP Homes</title>

  <style>
    :root {
      --color-navy: #16283F;
      --color-gold: #BC9A5F;
      --color-cream: #F6F2EA;
      --color-white: #FFFFFF;
      --color-text-dark: #2D3748;
      --color-text-muted: #6B6459;
      --color-border: #EAE5DC;
      --font-heading: 'Fraunces', Georgia, serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--color-cream);
      color: var(--color-text-dark);
      font-family: var(--font-body);
      line-height: 1.7;
      padding: 48px 24px 80px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    /* Brand Header */
    .brand-bar {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 24px;
    }

    .brand-dp {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1.35rem;
      color: var(--color-navy);
    }

    .brand-homes {
      font-family: var(--font-heading);
      font-weight: 400;
      font-size: 1.35rem;
      color: var(--color-gold);
      margin-right: 8px;
    }

    .brand-kw {
      font-family: var(--font-body);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #8C857B;
    }

    /* Page Title */
    .page-title {
      font-family: var(--font-heading);
      font-size: 2.75rem;
      font-weight: 600;
      color: var(--color-navy);
      line-height: 1.2;
      margin-bottom: 24px;
      letter-spacing: -0.01em;
    }

    /* Editorial Intro */
    .intro-text p {
      font-size: 1.05rem;
      line-height: 1.75;
      color: var(--color-text-dark);
      margin-bottom: 18px;
    }

    /* Form Card Container */
    .form-card {
      background: var(--color-white);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 36px 32px;
      margin-top: 36px;
      margin-bottom: 48px;
      box-shadow: 0 2px 10px rgba(22, 40, 63, 0.04);
    }

    .form-heading {
      font-family: var(--font-heading);
      font-size: 1.6rem;
      color: var(--color-navy);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .form-subheading {
      font-size: 0.95rem;
      color: var(--color-text-muted);
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--color-navy);
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 0.98rem;
      color: var(--color-text-dark);
      background-color: #FAF9F6;
      transition: all 0.2s ease-in-out;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: var(--color-gold);
      background-color: var(--color-white);
      box-shadow: 0 0 0 3px rgba(188, 154, 95, 0.15);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }
